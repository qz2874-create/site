<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Human to AI and Back · 修改地图</title>
<meta name="robots" content="noindex,nofollow">
<style id="revmap-style">
:root{
  --desk:#E6EAED;--paper:#FFFFFF;
  --ink:#1C2733;--ink-2:#55626E;--ink-3:#8B97A2;--rule:#D6DCE1;--rule-2:#E8ECEF;
  --pencil:#1F5FBF;--pencil-ink:#174A96;--pencil-wash:rgba(31,95,191,.09);
  --answer:#2D7A4B;--discuss:#1F5FBF;--experiment:#A44A1B;--danger:#B3261E;--doing:#B86E0A;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Revmap Latin Punct","Noto Serif CJK SC","Source Han Serif SC","Songti SC",SimSun,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",system-ui,sans-serif;
  --gutter:44px;--strip:40px;
}
/* Curly quotes and dashes in English review text must not fall through to a CJK font, which sets them full width. */
@font-face{font-family:"Revmap Latin Punct";src:local("Georgia"),local("Palatino Linotype"),local("Liberation Serif"),local("DejaVu Serif"),local("Times New Roman");unicode-range:U+2013-2014,U+2018-201F,U+2026}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pencil);outline-offset:2px}
[hidden]{display:none!important}
#app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto auto auto auto minmax(0,1fr)}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:12px 20px 10px;min-width:0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:0 1 auto}
.brand svg{flex:none;color:var(--pencil)}
.tw{display:flex;flex-direction:column;min-width:0}
.title-in{border:0;background:transparent;font:600 19px/1.25 var(--serif);padding:1px 4px;margin:-1px -4px;border-radius:6px;min-width:8ch;width:22ch;max-width:30vw;text-overflow:ellipsis}
.title-measure{position:absolute;left:-9999px;top:0;visibility:hidden;white-space:pre;font:600 19px/1.25 var(--serif)}
.title-in:hover{background:rgba(255,255,255,.65)}
.title-in:focus{background:#fff;outline:2px solid var(--pencil);outline-offset:0}
.title-static{font:600 19px/1.25 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.search{position:relative;display:flex;align-items:center}
.search input{width:216px;height:32px;border:1px solid var(--rule);border-radius:8px;background:#fff;padding:0 10px 0 30px}
.search.has-q input{padding-right:52px}
.search svg{position:absolute;left:9px;color:var(--ink-3);pointer-events:none}
.search .hits{position:absolute;right:9px;font-size:11.5px;color:var(--ink-2);pointer-events:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--rule);background:#fff;border-radius:8px;white-space:nowrap;line-height:1}
.btn:hover{border-color:#B6C0C9}
.btn.primary{background:var(--pencil);border-color:var(--pencil);color:#fff}
.btn.primary:hover{background:var(--pencil-ink);border-color:var(--pencil-ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:rgba(255,255,255,.75)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.icon{width:32px;padding:0}
.btn.sm.icon{width:28px}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.38;cursor:default}
.btn .badge{background:var(--pencil);color:#fff;border-radius:999px;font-size:11px;padding:1px 6px}
.save{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px;max-width:250px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save i{width:7px;height:7px;border-radius:50%;background:var(--answer);flex:none}
.save.idle i{background:var(--ink-3)}.save.warn i{background:#C77700}.save.err i{background:var(--danger)}
.overview{display:flex;gap:14px;align-items:center;font-size:12.5px;color:var(--ink-2);flex-wrap:nowrap;min-width:0;overflow:hidden;white-space:nowrap}
.overview>span{flex:none}
body.present .top{flex-wrap:nowrap}
.overview b{color:var(--ink);font-weight:600}
.ov-cats{display:inline-flex;gap:14px}
.ov-cat{display:inline-flex;align-items:center;gap:6px}
.ov-cat::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.stepno{font-size:12.5px;color:var(--ink-2);min-width:64px;text-align:center;font-variant-numeric:tabular-nums}

/* section toggles: the glyph is a column that is wide when the section is open and a sliver when it is a strip */
.secs{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:#fff;flex:none}
.secs button{border:0;border-left:1px solid var(--rule);background:#fff;height:30px;padding:0 10px 0 9px;font-size:12.5px;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.secs button:first-child{border-left:0}
.secs button i{display:block;width:10px;height:12px;border-radius:2px;background:var(--pencil);opacity:.8;transition:width .2s}
.secs button[aria-pressed="false"]{background:#EEF1F4;color:var(--ink-3)}
.secs button[aria-pressed="false"] i{width:3px;background:currentColor;opacity:1}
.secs button:hover{color:var(--pencil-ink)}

/* banner, tabs, presentation strip */
.banner{margin:0 20px 8px;padding:9px 12px 9px 14px;border-radius:8px;background:#fff;box-shadow:0 0 0 1px var(--rule);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner:empty{display:none}
.banner span{flex:1;min-width:200px}
.tabs{display:none;gap:4px;padding:0 12px 8px}
.tabs button{flex:1;height:32px;border:1px solid var(--rule);background:#fff;border-radius:8px}
.tabs button[aria-pressed="true"]{background:var(--pencil-wash);border-color:var(--pencil);color:var(--pencil-ink);font-weight:600}
.now{display:none}
body.present .now{display:flex}
.now{margin:0 20px 10px;height:90px;padding:10px 16px;background:#fff;border-radius:10px;box-shadow:0 0 0 1px var(--rule-2),0 8px 20px -14px rgba(28,39,51,.3);flex-direction:column;justify-content:center;gap:4px;overflow:hidden}
.now .nt{display:flex;gap:10px;align-items:baseline;flex-wrap:nowrap;min-width:0}
.now .nt>*{flex:none}
.now .nt .t{font-size:15px;font-weight:600;flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .ns{color:var(--ink-2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.now .np{display:inline-flex;gap:6px;align-items:center;color:var(--ink-2);font-size:12.5px}
.now .np svg{color:var(--doing)}

/* workspace */
#ws{position:relative;display:grid;grid-template-columns:minmax(0,1.25fr) var(--gutter) minmax(0,1fr) var(--gutter) minmax(0,1.1fr) var(--gutter) minmax(0,1.15fr);padding:0 20px 18px;min-height:0;transition:grid-template-columns .24s cubic-bezier(.3,.7,.2,1)}
.gutter{pointer-events:none}
.col{display:flex;flex-direction:column;min-height:0;min-width:0;container-type:inline-size}
.col-head{display:flex;align-items:center;gap:8px;padding:2px 2px 10px;min-height:42px;min-width:0}
.col-head h2{margin:0;font-size:15px;font-weight:600;white-space:nowrap}
.col-head .count{color:var(--ink-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-head .acts{margin-left:auto;display:flex;gap:4px;align-items:center;flex:none}
.col-head select{height:28px;border:1px solid var(--rule);border-radius:7px;background:#fff;padding:0 4px;font-size:12.5px}
.col-head .fold{color:var(--ink-3)}
.col-head .fold:hover{color:var(--ink)}
.col-body{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;overscroll-behavior:contain;position:relative}
#col-ex .col-body{padding:2px 4px 48px 2px}
#col-is .col-body,#col-so .col-body,#col-re .col-body{padding:0 2px 48px}
.list{background:var(--paper);border-radius:8px;box-shadow:0 0 0 1px var(--rule-2)}
.empty{color:var(--ink-2);padding:22px 18px;font-size:13px;line-height:1.6}
.muted{color:var(--ink-3)}
@container (max-width: 330px){
  .col-head .btn .lbl{display:none}
  .col-head .btn.sm.add{width:28px;padding:0}
}
@container (max-width: 250px){
  .col-head .count{display:none}
}

/* collapsed sections */
.strip{display:none}
@media (min-width: 961px){
  .col.collapsed>.col-head,.col.collapsed>.col-body{display:none}
  .col.collapsed>.strip{display:flex}
}
.strip{flex:1;flex-direction:column;align-items:center;gap:12px;margin-top:2px;padding:14px 0;background:var(--paper);border-radius:8px;box-shadow:0 0 0 1px var(--rule-2);cursor:pointer;color:var(--ink-2);user-select:none;overflow:hidden}
.strip:hover{box-shadow:0 0 0 1px var(--pencil);color:var(--pencil-ink)}
.strip .s-title{writing-mode:vertical-rl;font-weight:600;font-size:13.5px;color:var(--ink);letter-spacing:.06em;white-space:nowrap}
.strip .s-count{writing-mode:vertical-rl;font-size:12px;white-space:nowrap}

/* review sheets */
.sheet{background:var(--paper);border-radius:3px;margin:0 0 14px;position:relative;box-shadow:0 1px 2px rgba(28,39,51,.07),0 10px 26px -14px rgba(28,39,51,.22)}
.sheet::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--rv);border-radius:3px 0 0 3px}
.sheet-head{display:flex;align-items:center;gap:10px;padding:13px 12px 6px 22px;cursor:pointer;user-select:none}
.rv-tab{font-weight:650;font-size:12px;color:#fff;background:var(--rv);padding:1px 7px;border-radius:4px;letter-spacing:.02em;white-space:nowrap}
.rv-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rv-cover{margin-left:auto;font-size:12px;color:var(--ink-2);white-space:nowrap}
.chev{transition:transform .18s;color:var(--ink-3);flex:none}
.sheet.collapsed .chev{transform:rotate(-90deg)}
.sheet-meta{padding:0 22px 6px;font-size:12px;color:var(--ink-2)}
.sheet.collapsed .sheet-body,.sheet.collapsed .sheet-meta{display:none}
.sheet-body{padding:0 8px 14px 12px}
.para-h{margin:14px 0 4px 4px;padding:2px 6px;font:600 12.5px/1.45 var(--sans);color:var(--ink-2);border-radius:4px}
body:not(.present) [data-edit]:hover{background:#F2F5F7;cursor:default}
.sheet-meta [data-edit]{border-radius:4px;padding:0 4px;margin:0 -4px}
.para{position:relative;padding:6px 26px 6px 10px;border-radius:4px;cursor:pointer;transition:opacity .2s,background-color .15s}
.para-text{margin:0;font:15px/1.62 var(--serif);color:var(--ink);max-width:72ch;overflow-wrap:anywhere}
.para.bullet .para-text{padding-left:15px;position:relative}
.para.bullet .para-text::before{content:"";position:absolute;left:2px;top:.72em;width:5px;height:5px;border-radius:50%;background:var(--ink-3)}
.para:hover{background:#F5F7F9}
.para.pending::after{content:"";position:absolute;left:-4px;top:14px;width:8px;height:8px;border-radius:50%;border:1.5px dashed var(--ink-3)}
mark.hl{--a:.3;--top:58%;color:inherit;background-image:linear-gradient(transparent var(--top),rgba(var(--c),var(--a)) var(--top),rgba(var(--c),var(--a)) 92%,transparent 92%);background-repeat:no-repeat;background-size:100% 100%;background-color:transparent;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0}
mark.hl.multi{--a:.46}
mark.hl.okq{--a:0;text-decoration:underline dotted rgba(var(--c),.9);text-decoration-thickness:1.5px;text-underline-offset:3px}
mark.hl.sweep{animation:sweep .7s cubic-bezier(.3,.7,.2,1) both}
@keyframes sweep{from{background-size:0% 100%}to{background-size:100% 100%}}

/* issues */
.irow{position:relative;padding:9px 30px 9px 16px;border-top:1px solid var(--rule-2);cursor:pointer;transition:opacity .2s,background-color .15s}
.irow:first-child{border-top:0}
.irow::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 2px 2px 0;background:var(--cat)}
.irow:hover{background:#F6F8FA}
.irow .t{font-size:13.5px;line-height:1.45}
.code{font-weight:650;font-variant-numeric:tabular-nums;margin-right:6px}
.imeta{display:flex;gap:4px 10px;align-items:center;margin-top:3px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.cat{display:inline-flex;align-items:center;gap:5px;color:var(--cat);font-weight:500}
.cat::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--cat)}
.rvs{display:inline-flex;gap:5px}
.rvs b{font-size:11.5px;font-weight:650;color:rgb(var(--c))}
.lack{color:#9A5B00}
.irow.ok{background:repeating-linear-gradient(135deg,#FAFBFC 0 6px,#F4F6F8 6px 12px)}
.irow.ok::before{background:var(--ink-3)}
.group-h{padding:10px 16px 6px;font-size:12px;font-weight:600;color:var(--ink-2);border-top:1px solid var(--rule-2);background:#FAFBFC}
.group-h:first-child{border-top:0;border-radius:8px 8px 0 0}

/* problem solving: a progress pie leads each card */
.srow{position:relative;display:grid;grid-template-columns:20px minmax(0,1fr) auto;column-gap:10px;row-gap:3px;padding:10px 26px 10px 14px;border-top:1px solid var(--rule-2);cursor:pointer;transition:opacity .2s,background-color .15s}
.srow:first-child{border-top:0}
.srow:hover{background:#F6F8FA}
.pie{width:20px;height:20px;border:0;background:none;padding:0;color:var(--ink-3);display:grid;place-items:center;border-radius:50%}
body:not(.present) .pie:hover{background:var(--pencil-wash)}
.srow.p-doing .pie{color:var(--doing)}.srow.p-done .pie{color:var(--answer)}
.srow .t{font-size:13.5px;font-weight:600;line-height:1.45;overflow-wrap:anywhere}
.srow.p-done .t{color:var(--ink-2)}
.srow .m{font-size:12px;color:var(--ink-2);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.srow .m .codes{font-weight:600;color:var(--ink)}
.srow .m .pct{color:var(--ink-2)}
.srow.p-doing .m .pct{color:var(--doing)}.srow.p-done .m .pct{color:var(--answer)}
.srow .d,.srow .res{grid-column:2/4;font-size:12.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.srow .d{color:var(--ink-2)}
.srow .res{color:var(--ink)}
.srow .res b{font-weight:600;color:var(--answer);margin-right:6px}
.thumbs{grid-column:2/4;display:flex;gap:6px;margin-top:4px;align-items:center}
.thumbs img{height:46px;width:auto;max-width:92px;object-fit:cover;border-radius:4px;box-shadow:0 0 0 1px var(--rule);background:#F4F6F8;cursor:zoom-in}
.thumbs .more-n{font-size:12px;color:var(--ink-2)}
.srow .more{display:none;grid-column:2/4}
#ws.has-focus .srow.in-chain .more{display:block}
#ws.has-focus .srow.in-chain .d,#ws.has-focus .srow.in-chain .res,#ws.has-focus .srow.in-chain .thumbs{display:none}
.more .sec{margin-top:8px}
.more .sec:first-child{margin-top:4px}
.more h5{margin:0 0 2px;font-size:12px;font-weight:600;color:var(--ink-2)}
.more p{margin:0;font-size:12.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.more ul.ro{margin:0;padding:0;list-style:none}
.more ul.ro li{position:relative;padding-left:18px;font-size:12.5px;line-height:1.55;margin-top:2px}
.more ul.ro li::before{content:"";position:absolute;left:2px;top:.42em;width:9px;height:9px;border:1.5px solid var(--ink-3);border-radius:2px}
.more ul.ro li.ok{color:var(--ink-2)}
.more ul.ro li[data-step]{cursor:pointer;border-radius:4px}
.more ul.ro li[data-step]:hover{background:rgba(31,95,191,.06)}
.more ul.ro li[data-step]:hover::before{border-color:var(--answer)}
.more h5 small{font-weight:400;margin-left:4px}
.more ul.ro li.ok::before{background:var(--answer);border-color:var(--answer)}
.more figure{margin:8px 0 0}
.more figure img{display:block;max-width:100%;max-height:46vh;width:auto;height:auto;border-radius:4px;box-shadow:0 0 0 1px var(--rule);cursor:zoom-in;background:#F4F6F8}
.more figcaption{font-size:12px;color:var(--ink-2);margin-top:4px;line-height:1.5}
.miss-img{display:grid;place-items:center;height:46px;min-width:64px;border-radius:4px;background:#F4F6F8;color:var(--ink-3);font-size:11px;box-shadow:0 0 0 1px var(--rule)}
.srow.img-over{box-shadow:inset 0 0 0 2px var(--pencil);background:var(--pencil-wash)}

/* response letter: our side of the correspondence, set like the reviewers' sheets */
.letter{background:var(--paper);border-radius:3px;position:relative;padding:14px 6px 18px 10px;box-shadow:0 1px 2px rgba(28,39,51,.07),0 10px 26px -14px rgba(28,39,51,.22)}
.letter::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--pencil);border-radius:3px 0 0 3px}
.letter-head{padding:2px 12px 10px;font:600 15px/1.35 var(--serif)}
.letter-head small{display:block;font:12px/1.5 var(--sans);color:var(--ink-2);margin-top:2px}
.rrow{position:relative;padding:8px 12px 10px 12px;border-radius:4px;cursor:pointer;transition:opacity .2s,background-color .15s}
.rrow:hover{background:#F5F7F9}
.rrow+.rrow{margin-top:2px}
.rrow:not(.empty)+.rrow,.rrow+.rrow:not(.empty){margin-top:8px}
.rl{display:flex;gap:4px 8px;align-items:baseline;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:2px}
.rl .code{color:var(--ink)}
.rl .tag{margin-left:auto;font-size:11.5px;padding:0 7px;border-radius:999px;background:#EEF1F4;color:var(--ink-2);line-height:1.6}
.rrow.final .rl .tag{background:#E3F1E8;color:var(--answer)}
.rl .tag.todo{background:transparent;color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--rule)}
.rrow.empty{padding-top:6px;padding-bottom:6px}
.rrow.empty .rl{margin-bottom:0}
.rt{margin:0;font:14.5px/1.6 var(--serif);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.rrow.editing{background:#fff;box-shadow:inset 0 0 0 1px var(--pencil);cursor:default}
.rt-edit{display:block;width:100%;border:1px solid var(--rule);border-radius:6px;padding:6px 8px;font:14.5px/1.6 var(--serif);resize:none;overflow:hidden;background:#fff;min-height:70px}
.rt-edit:focus{outline:2px solid var(--pencil);outline-offset:-1px;border-color:transparent}
.rbar{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.rbar .seg button{padding:4px 10px;font-size:12.5px}

/* ports, focus, search */
.port{position:absolute;right:7px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;border:1.5px solid var(--ink-3);background:#fff;cursor:crosshair;opacity:0;transition:opacity .15s;touch-action:none}
.para .port{top:17px;margin-top:-6px}
.srow .port{top:21px;margin-top:-6px}
.row:hover .port,.row:focus-visible .port,.row.is-focus .port{opacity:1}
.port:hover{border-color:var(--pencil);background:var(--pencil-wash)}
body.present .port{display:none}
.row.drop-ok{box-shadow:inset 0 0 0 2px var(--pencil);background:var(--pencil-wash)}
body.linking .row{cursor:crosshair}
#ws.has-focus .row:not(.in-chain){opacity:.3}
#ws.has-focus mark.hl{--a:.08}
#ws.has-focus mark.hl.okq{--a:0;text-decoration-color:rgba(var(--c),.3)}
#ws.has-focus mark.hl.in-chain{--a:.3;--top:8%}
#ws.has-focus mark.hl.okq.in-chain{--a:.16;text-decoration-color:rgba(var(--c),.9)}
.row.is-focus{background:var(--pencil-wash)}
.irow.is-focus,.srow.is-focus,.rrow.is-focus{box-shadow:inset 3px 0 0 var(--pencil)}
#ws.searching .row.miss{opacity:.28}
#ws.searching .row.hit{background:#FFF8DC}

/* wires */
#wires{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:4}
#wires path{fill:none;stroke-linecap:round}
#wires .w{stroke-width:1.3;opacity:.32;transition:opacity .2s,stroke-width .2s}
#wires .w.off{stroke-dasharray:3 4}
#wires .w.stub{opacity:.45}
#wires .w.comb{opacity:.28}
#ws.has-focus #wires .w{opacity:.05}
#ws.has-focus #wires .w.in-chain{opacity:.95;stroke-width:2.3}
#wires .w.hot{opacity:.85;stroke-width:2}
#wires .hit{stroke:transparent;stroke-width:11;pointer-events:stroke;cursor:pointer}
body.present #wires .hit{pointer-events:none}
#wires .tmp{stroke:var(--pencil);stroke-width:2;stroke-dasharray:5 4;opacity:1}

/* inspector: slides in from whichever side keeps the item and its neighbour visible */
.insp{position:fixed;top:12px;right:12px;bottom:12px;width:min(440px,calc(100vw - 24px));background:#fff;border-radius:12px;box-shadow:0 16px 44px rgba(28,39,51,.24),0 0 0 1px var(--rule-2);z-index:30;display:flex;flex-direction:column;transform:translateX(calc(100% + 28px));transition:transform .22s cubic-bezier(.3,.7,.2,1);visibility:hidden}
.insp.left{right:auto;left:12px;transform:translateX(calc(-100% - 28px))}
.insp.open{transform:none;visibility:visible}
.insp-head{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--rule-2)}
.insp-head b{font-size:14px}
.insp-body{overflow:auto;padding:14px 16px 28px;flex:1}
.field{display:block;margin:0 0 14px}
.field>span,.lab{display:block;font-size:12px;color:var(--ink-2);margin-bottom:5px}
.lab small{color:var(--ink-3);font-size:11.5px;margin-left:4px}
.field input[type=text],.field input:not([type]),.field textarea,.field select{width:100%;border:1px solid var(--rule);border-radius:8px;padding:7px 10px;background:#fff}
.field textarea{resize:vertical;min-height:72px;line-height:1.55}
.field textarea.serif{font:14.5px/1.6 var(--serif)}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--pencil);outline-offset:-1px;border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:#fff;flex-wrap:wrap}
.seg button{border:0;background:#fff;padding:6px 11px;border-left:1px solid var(--rule)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--pencil-wash);color:var(--pencil-ink);font-weight:600}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.lk{display:flex;gap:8px;align-items:flex-start;padding:7px 8px 7px 10px;border-radius:8px;background:#F7F9FA;margin-bottom:6px}
.lk .q{flex:1;font:13px/1.5 var(--serif);border-left:3px solid rgb(var(--c));padding-left:8px;overflow-wrap:anywhere}
.lk .q small{display:block;font:11.5px/1.4 var(--sans);color:var(--ink-2);margin-top:2px}
.lk .x{border:0;background:none;width:24px;height:24px;border-radius:6px;color:var(--ink-3);flex:none}
.lk .x:hover{background:#E9EDF0;color:var(--danger)}
.lk .go{border:0;background:none;color:var(--pencil);padding:0;font-size:12px}
.steps .step{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
.steps .step textarea{flex:1;border:1px solid var(--rule);border-radius:7px;padding:5px 8px;resize:none;overflow:hidden;line-height:1.5;min-height:32px}
.steps .step textarea:focus{outline:2px solid var(--pencil);outline-offset:-1px;border-color:transparent}
.steps .step input[type=checkbox]{width:16px;height:16px;margin-top:8px;accent-color:var(--answer);flex:none}
.steps .step .btn{margin-top:2px;flex:none}
.hr{height:1px;background:var(--rule-2);margin:18px 0}
.prog{display:flex;align-items:center;gap:12px}
.prog input[type=range]{flex:1;accent-color:var(--pencil);margin:0}
.prog output{min-width:44px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips .fchip::before{display:none}
.figs .fig{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:8px;align-items:start;margin-bottom:8px}
.figs .fig img{width:84px;height:62px;object-fit:cover;border-radius:4px;box-shadow:0 0 0 1px var(--rule);cursor:zoom-in;background:#F4F6F8}
.figs .fig textarea{width:100%;min-height:62px;border:1px solid var(--rule);border-radius:7px;padding:5px 8px;resize:vertical;line-height:1.5;font-size:12.5px}
.figs .fig textarea:focus{outline:2px solid var(--pencil);outline-offset:-1px;border-color:transparent}
.fig-acts{display:flex;flex-direction:column;gap:2px}
.drop{display:block;width:100%;border:1.5px dashed var(--rule);border-radius:8px;padding:14px 12px;text-align:center;color:var(--ink-2);font-size:12.5px;cursor:pointer;background:#FAFBFC;line-height:1.5}
.drop:hover,.drop.over{border-color:var(--pencil);background:var(--pencil-wash);color:var(--pencil-ink)}

/* modal, popover, toast, selection bar, lightbox */
.back{position:fixed;inset:0;background:rgba(28,39,51,.3);display:grid;place-items:center;z-index:40;padding:16px}
.modal{background:#fff;border-radius:12px;width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(28,39,51,.3)}
.modal h3{margin:0;padding:16px 18px 6px;font-size:15px}
.modal .mb{padding:8px 18px 4px}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:10px 18px 16px}
.modal p{margin:0 0 10px;line-height:1.6;color:var(--ink-2)}
.snap{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--rule-2)}
.snap:first-child{border-top:0}
.snap div{flex:1}
.snap small{color:var(--ink-2)}
.pop{position:fixed;z-index:50;background:#fff;border-radius:10px;box-shadow:0 12px 36px rgba(28,39,51,.22),0 0 0 1px var(--rule-2);min-width:240px;max-width:min(440px,calc(100vw - 24px));padding:6px}
.pop input[type=search]{width:100%;height:32px;border:1px solid var(--rule);border-radius:7px;padding:0 10px;margin-bottom:6px}
.pop .opts{max-height:min(360px,60vh);overflow:auto}
.pop .opt{display:flex;gap:8px;align-items:baseline;padding:6px 8px;border-radius:6px;cursor:pointer;line-height:1.45}
.pop .opt:hover,.pop .opt.act{background:var(--pencil-wash)}
.pop .opt .code{flex:none;min-width:28px}
.pop .opt.new{color:var(--pencil-ink);font-weight:600}
.pop .sep{height:1px;background:var(--rule-2);margin:4px 2px}
.pop .ttl{font-size:12px;color:var(--ink-2);padding:4px 8px 6px}
.pop .chiprow{display:flex;flex-wrap:wrap;gap:6px;padding:2px 6px 10px}
.fchip{border:1px solid var(--rule);background:#fff;border-radius:999px;padding:3px 10px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.fchip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--ink-3))}
.fchip[aria-pressed="true"]{border-color:var(--pencil);background:var(--pencil-wash);color:var(--pencil-ink);font-weight:600}
.menu .opt{align-items:center}
.menu .opt small{margin-left:auto;color:var(--ink-3)}
.selbar{position:fixed;z-index:45;display:flex;gap:2px;background:var(--ink);color:#fff;border-radius:9px;padding:4px;box-shadow:0 8px 24px rgba(28,39,51,.3)}
.selbar button{border:0;background:transparent;color:#fff;padding:6px 10px;border-radius:6px;font-size:12.5px}
.selbar button:hover{background:rgba(255,255,255,.15)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 10px 9px 14px;border-radius:9px;display:flex;gap:10px;align-items:center;z-index:60;box-shadow:0 8px 26px rgba(28,39,51,.3);max-width:calc(100vw - 32px)}
.toast button{border:0;background:transparent;color:#A9C8FF;font-weight:600;padding:2px 6px}
.lb{position:fixed;inset:0;z-index:70;background:rgba(16,22,29,.88);display:grid;grid-template-rows:minmax(0,1fr) auto;padding:28px 72px 18px}
.lb img{display:block;max-width:100%;max-height:100%;margin:auto;object-fit:contain;border-radius:3px;box-shadow:0 20px 60px rgba(0,0,0,.4);background:#fff}
.lb .cap{color:#E6EAED;text-align:center;padding:12px 0 0;font-size:13.5px;line-height:1.6;max-width:900px;margin:0 auto}
.lb .cap small{display:block;color:#9AA6B1;font-size:12px}
.lb button{position:absolute;border:0;background:rgba(255,255,255,.12);color:#fff;width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.lb button:hover{background:rgba(255,255,255,.24)}
.lb .x{top:16px;right:16px}
.lb .pv{left:16px;top:50%;margin-top:-20px}
.lb .nx{right:16px;top:50%;margin-top:-20px}

/* attachments */
.atts{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center;min-width:0}
.atts .more-n{font-size:12px;color:var(--ink-2)}
#ws.has-focus .srow.in-chain .atts{display:none}
.att{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-width:0;height:26px;padding:0 9px 0 3px;border:1px solid var(--rule);border-radius:7px;background:#fff;font-size:12px;line-height:1;color:var(--ink);cursor:pointer;text-align:left}
.att:hover{border-color:rgb(var(--c));background:rgba(var(--c),.06)}
.att:focus-visible{outline:2px solid var(--pencil);outline-offset:1px}
.att b{flex:none;font:700 9.5px/1 var(--sans);letter-spacing:.03em;color:#fff;background:rgb(var(--c));border-radius:4px;padding:4px 5px}
.att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.att small{flex:none;color:var(--ink-3);font-size:11px}
.att.miss{opacity:.55;border-style:dashed}
.more .att-item{margin-top:6px}
.more .att-item:first-of-type{margin-top:2px}
.more .att-item p{margin:3px 0 0 3px;color:var(--ink-2);font-size:12px}
.files .fil{display:grid;grid-template-columns:40px minmax(0,1fr) auto;column-gap:9px;row-gap:6px;align-items:center;margin-bottom:8px;padding:8px 8px 8px 8px;border-radius:8px;background:#F7F9FA}
.files .fil.miss{opacity:.6}
.files .kb{grid-row:1/3;align-self:stretch;width:40px;min-height:46px;border:0;border-radius:6px;background:rgb(var(--c));color:#fff;font:700 10px/1 var(--sans);letter-spacing:.03em;cursor:pointer;padding:0}
.files .kb:hover{filter:brightness(1.08)}
.fil-main{min-width:0;display:flex;align-items:baseline;gap:7px}
.fil-name{min-width:0;border:0;background:none;padding:0;font-weight:600;font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;text-align:left}
.fil-name:hover{color:var(--pencil);text-decoration:underline}
.fil-main small{flex:none;color:var(--ink-3);font-size:11.5px}
.fil-acts{display:flex;gap:1px}
.files .fil input[type=text]{grid-column:2/4;width:100%;height:30px;padding:0 9px;border-radius:7px;font-size:12.5px}
.drop[data-fdrop]{display:flex;align-items:center;justify-content:center;gap:6px}
.fv{position:fixed;inset:0;z-index:70;background:rgba(16,22,29,.72);display:flex;padding:20px 28px 24px}
.fv-win{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.fv-bar{display:flex;align-items:center;gap:8px;padding:9px 10px 9px 12px;border-bottom:1px solid var(--rule-2);background:#FAFBFC}
.fv-bar .kb{flex:none;font:700 10px/1 var(--sans);letter-spacing:.03em;color:#fff;background:rgb(var(--c));border-radius:5px;padding:6px 7px}
.fv-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.fv-t .nm{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fv-t small{font-size:11.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fv-bar a.btn{text-decoration:none;color:var(--ink)}
.fv-bar a.btn:hover{background:#F2F5F7}
.fv-body{flex:1;min-height:0;background:#fff}
.fv-body iframe{display:block;width:100%;height:100%;border:0;background:#fff}
.fv-img{height:100%;display:grid;place-items:center;padding:16px;background:#F4F6F8}
.fv-img img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 0 0 1px var(--rule)}
@media (max-width: 960px){.fv{padding:8px}.fv-bar a.btn{padding:0 8px}.fv-bar a.btn svg{display:none}}
/* present mode */
body.present .edit-only{display:none!important}

@media (max-width: 1360px){
  .save .txt{display:none}
  .save{cursor:help}
}
@media (max-width: 1220px){
  .search input{width:170px}
  .title-in{max-width:24vw}
}
@media (max-width: 1180px){
  .search input{width:128px}
  .top [data-t="filter"] .lbl{display:none}
  .top [data-t="filter"]{padding:0 9px}
  .title-in{max-width:20vw}
  .secs button{padding:0 8px 0 7px}
}
@media (max-width: 960px){
  #ws{grid-template-columns:minmax(0,1fr)!important;padding:0 12px 12px}
  .gutter,#wires{display:none}
  .col{display:none}
  .col.on{display:flex}
  .tabs{display:flex}
  .secs{display:none}
  .search input{width:150px}
  .title-in{width:16ch;max-width:52vw}
  .save{display:none}
  .top{padding:10px 12px 8px}
  .banner,.now{margin:0 12px 8px}
  .insp.left{left:auto;right:12px;transform:translateX(calc(100% + 28px))}
  .insp.open{transform:none}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}

function markedText(e) {
  var text = norm(e.text), rv = IX.rv.get(e.reviewer), c = rgbOf(rv ? rv.color : '#5E6B78');

  outOf(e.id).forEach(function (l) {
    if (!l.quote) return;
    var q = norm(l.quote), at = text.indexOf(q);
    if (at < 0 || !q) return;
    spans.push({ a: at, b: at + q.length, l: l.id, ok: l.to === 'i-ok' });
  });
  if (!spans.length) return esc(text);
  var cuts = new Set([0, text.length]);
  spans.forEach(function (s) { cuts.add(s.a); cuts.add(s.b); });
  var pts = Array.from(cuts).sort(function (x, y) { return x - y; }), out = '';
  for (var k = 0; k < pts.length - 1; k++) {
    var a = pts[k], b = pts[k + 1], seg = text.slice(a, b);
    var cover = spans.filter(function (s) { return s.a <= a && s.b >= b; });
    if (!cover.length) { out += esc(seg); continue; }
    var allOk = cover.every(function (s) { return s.ok; });
    var real = cover.filter(function (s) { return !s.ok; }).length;
    out += '<mark class="hl' + (allOk ? ' okq' : '') + (real > 1 ? ' multi' : '') + '" style="--c:' + c + '" data-l="' + cover.map(function (s) { return s.l; }).join(' ') + '">' + esc(seg) + '</mark>';

  return out;
}

/* ---------------- response letter export ---------------- */
function buildResponseMD() {
  reindex();
  var d = S.data, out = ['# Response to reviewers', '', d.meta.title, ''], printed = new Map(), placed = new Set();
  function enName(r) { return norm(String(r.name || r.short).replace(/（[^）]*）|\([^)]*\)/g, '')) || r.short; }
  d.reviewers.forEach(function (r) {
    var exs = exOf(r.id).filter(function (e) { return e.kind === 'text'; });
    if (!exs.length) return;
    out.push('## ' + enName(r), '');
    // Consecutive paragraphs that map to the same issues share one response; lead-in lines go with what follows.
    var blocks = [], carry = [];
    exs.forEach(function (e) {
      var iss = []; outOf(e.id).forEach(function (l) { var i = IX.is.get(l.to); if (i && iss.indexOf(i) < 0) iss.push(i); });
      var real = iss.filter(function (i) { return i.kind !== 'ok'; });
      var key = !iss.length ? '?' + e.id : real.length ? real.map(function (i) { return i.id; }).sort().join('|') : 'ok';
      if (iss.length && !real.length && /[:：]$/.test(norm(e.text))) { carry.push(e); return; }
      var last = blocks[blocks.length - 1];
      if (last && last.key === key && !carry.length) last.ex.push(e);
      else blocks.push({ key: key, ex: carry.concat([e]), real: real, linked: iss.length > 0 });
      carry = [];
    });
    if (carry.length) blocks.push({ key: 'ok', ex: carry, real: [], linked: true });
    blocks.forEach(function (bk) {
      bk.ex.forEach(function (e) { out.push('> ' + norm(e.text), ''); });
      if (!bk.linked) { out.push('**Response.** [待写：这段还没连到问题]', ''); return; }
      if (!bk.real.length) { out.push('**Response.** We thank the reviewer for this comment.', ''); return; }
      var codes = bk.real.map(function (i) { return i.code; }).filter(Boolean).join(', ');
      var ref = 'Please see our response to ' + enName(r) + (codes ? ' (' + codes + ')' : '') + ' above.';
      var sols = []; bk.real.forEach(function (i) { outOf(i.id).forEach(function (l) { var s = IX.so.get(l.to); if (s && sols.indexOf(s) < 0) sols.push(s); }); });
      var parts = [], where = [];
      sols.forEach(function (s) {
        var rs = outOf(s.id).map(function (l) { return IX.re.get(l.to); }).filter(Boolean);
        var keys = rs.length ? rs.map(function (x) { return x.id; }) : ['sol:' + s.id];
        keys.forEach(function (k, n) {
          if (printed.has(k)) { var old = printed.get(k); if (parts.indexOf(old) < 0) parts.push(old); return; }
          printed.set(k, ref);
          var txt = rs[n] && norm(rs[n].text) ? rs[n].text.trim() : '[待写回复：' + s.title + ']';
          parts.push(txt);
        });
        if (!placed.has(s.id)) { placed.add(s.id); if (s.where && where.indexOf(s.where) < 0) where.push(s.where); }
      });
      if (!sols.length) parts.push('[待写：问题 ' + codes + ' 还没有做法]');
      out.push('**Response' + (codes ? ' (' + codes + ')' : '') + '.** ' + parts.join('\n\n'), '');
      if (where.length) out.push('*Changes in the manuscript:* ' + where.join('；'), '');
    });
  });
  return out.join('\n');
}

    var dz = e.target.closest && e.target.closest('[data-drop],[data-fdrop]');
    $$('.drop.over').forEach(function (d) { if (d !== dz) d.classList.remove('over'); });
    if (dz && hasFiles(e)) dz.classList.add('over');
  });
  document.addEventListener('pointerdown', function (e) {
    if (!S.editingResp) return;
    var t = e.target;
    // Clicks on other rows are settled by the row handlers, so a double-click can move straight to another reply.
    if (t.closest('.rrow.editing') || t.closest('.pop') || t.closest('.back') || t.closest('.toast') || t.closest('.lb') || t.closest('.fv') || t.closest('#insp') || t.closest('#ws .row')) return;
    finishRespEdit();
  }, true);
  document.addEventListener('mouseup', function (e) { if (!e.target.closest('.selbar') && !e.target.closest('.pop')) onSelectEnd(); });
  document.addEventListener('keyup', function (e) { if (e.shiftKey && e.key.indexOf('Arrow') === 0) onSelectEnd(); });
  $('#top').addEventListener('click', function (e) {
    var sb = e.target.closest('[data-sec]'); if (sb) { toggleCol(sb.dataset.sec); return; }
    var b = e.target.closest('[data-t]'); if (!b) return;
    var t = b.dataset.t, r = b.getBoundingClientRect();
    if (t === 'undo') undo(); else if (t === 'redo') redo();
    else if (t === 'save') saveToFile(false);
    else if (t === 'present') setMode('present');
    else if (t === 'edit') setMode('edit');
    else if (t === 'menu') openMenu(r.right - 260, r.bottom + 6);
    else if (t === 'filter') openFilter(r.left, r.bottom + 6);
    else if (t === 'play') togglePlay();
    else if (t === 'prev') { stopPlay(); renderTop(); gotoStep(S.play.idx - 1); }
    else if (t === 'next') { stopPlay(); renderTop(); gotoStep(S.play.idx + 1); }
  });
  $('#top').addEventListener('input', function (e) {
    if (e.target.id === 'titleIn') { coalesce('meta.title'); S.data.meta.title = e.target.value; document.title = e.target.value || '修改地图'; fitTitle(); S.fileDirty = true; scheduleCache(); renderTopButtons(); }
    else if (e.target.id === 'q') { S.search = e.target.value; render(); revealHits(); }
  });
  $('#tabs').addEventListener('click', function (e) { var b = e.target.closest('[data-tab]'); if (b) { S.tab = b.dataset.tab; render(); if (S.focus) scrollChainIntoView(true); } });
  var insp = $('#insp');
  insp.addEventListener('input', onInspectorInput);
  insp.addEventListener('change', onInspectorChange);
  insp.addEventListener('click', onInspectorClick);
  $('#fileIn').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var rd = new FileReader(); rd.onload = function () { importText(String(rd.result), f.name); }; rd.readAsText(f, 'utf-8'); e.target.value = '';
  });
  $('#attIn').addEventListener('change', function (e) {
    var fs = e.target.files; if (fs && fs.length && S.attTarget) addFiles(S.attTarget, fs);
    e.target.value = '';
  });
  $('#imgIn').addEventListener('change', function (e) {
    var fs = e.target.files; if (fs && fs.length && S.imgTarget) addImages(S.imgTarget, fs);
    e.target.value = '';
  });
  document.addEventListener('keydown', function (e) {
    var mod = e.metaKey || e.ctrlKey, ae = document.activeElement, inField = ae && (/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName) || ae.isContentEditable), k = (e.key || '').toLowerCase();
    if (FV) { if (e.key === 'Escape') { e.preventDefault(); closeViewer(); } return; }
    if (LB) { if (e.key === 'Escape') { e.preventDefault(); closeLightbox(); } else if (e.key === 'ArrowLeft') stepLightbox(-1); else if (e.key === 'ArrowRight') stepLightbox(1); return; }
    if (mod && k === 's') { e.preventDefault(); if (S.mode === 'edit') saveToFile(false); return; }
    if (mod && k === 'z' && !inField && S.mode === 'edit') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
    if (mod && k === 'y' && !inField && S.mode === 'edit') { e.preventDefault(); redo(); return; }
    if (e.key === 'Escape') { if (POP) closePop(); else if (SEL) hideSelbar(); else if (S.editingResp) finishRespEdit(); else if (S.insp) closeInspector(); else if (S.focus) setFocus(null); return; }
    if (inField) return;
    if (e.key === '/' && S.mode === 'edit') { e.preventDefault(); var q = $('#q'); if (q) q.focus(); return; }
    if (S.mode === 'present') {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); gotoStep(S.play.idx + 1); }
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); gotoStep(S.play.idx - 1); }
      else if (e.key === ' ' && !(ae && ae.closest && ae.closest('.row'))) { e.preventDefault(); togglePlay(); }
    }
  });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') scheduleCache.flush(); });
  window.addEventListener('pagehide', function () { scheduleCache.flush(); });
  window.addEventListener('beforeunload', function (e) { scheduleCache.flush(); if (S.cacheErr && S.fileDirty) { e.preventDefault(); e.returnValue = ''; } });
}
function linkPopover(lid, x, y) {
  var l = IX.lk.get(lid); if (!l) return;
  var ft = typeOf(l.from), tt = typeOf(l.to), a = getObj(l.from), b = getObj(l.to);
  function lab(o, t, quote) {
    if (t === 'excerpt') return quote ? '“' + oneLine(quote, 60) + '”' : '整段原文';
    if (t === 'issue') return o.kind === 'ok' ? '无需修改' : (o.code ? o.code + ' ' : '') + o.title;
    if (t === 'solution') return '做法：' + o.title;
    return '回复：' + (norm(o.text) ? oneLine(o.text, 40) : '（空白）');
  }
  var el = openPop('<div class="ttl">' + esc(lab(a, ft, l.quote)) + '<br>连到 ' + esc(lab(b, tt)) + '</div><div class="opts menu"><div class="opt" data-m="del">删除这条连接</div></div>', x + 8, y + 8, 'menu');
  el.addEventListener('click', function (e) { if (e.target.closest('[data-m="del"]')) { closePop(); removeLink(lid); } });
}

/* ---------------- cloud bridge (used by cloud.js) ---------------- */
window.RevmapAPI = {
  getData: function () { return JSON.parse(JSON.stringify(S.data)); },
  referencedAssets: function (d) { return referencedAssets(d || S.data); },
  setData: function (d, assets) {
    S.cloudApplying = true;
    try {
      var keepTab = S.tab;
      S.data = migrate(JSON.parse(JSON.stringify(d)));
      Object.keys(assets || {}).forEach(function (k) { if (typeof assets[k] === 'string') S.assets.set(k, assets[k]); });
      S.fileDirty = false; S.undo = []; S.redo = []; S.tab = keepTab;
      document.title = S.data.meta.title || '修改地图';
      if (S.insp && !document.querySelector('#insp :focus')) closeInspector();
      renderTop(); render(); cacheWrite();
    } finally { S.cloudApplying = false; }
  },
  refreshStatus: function () { renderSaveState(); },
  toast: function (m, label, fn) { toast(m, label, fn); },
  labelOf: function (id) {
    var t = typeOf(id), o = getObj(id);
    if (!t || !o) return null;
    if (t === 'excerpt') { var r = IX.rv.get(o.reviewer); return { type: t, kind: '原文', label: (r ? r.short + '：' : '') + oneLine(o.text, 40), color: r ? r.color : '#5E6B78' }; }
    if (t === 'issue') return { type: t, kind: '问题', label: o.kind === 'ok' ? '无需修改' : (o.code ? o.code + ' ' : '') + (o.title || '未命名问题'), color: o.kind === 'ok' ? '#8B97A2' : catOf(o).color };
    if (t === 'solution') return { type: t, kind: '做法', label: o.title || '未命名做法', color: '#55626E' };
    if (t === 'response') { var c = codesOf(issuesOfResponse(id)); return { type: t, kind: '回复', label: (c.length ? c.join(' ') + '：' : '') + (norm(o.text) ? oneLine(o.text, 40) : '（还没写）'), color: '#1F5FBF' }; }
    return { type: t, kind: '审稿人', label: o.short + ' ' + o.name, color: o.color };
  },
  goto: function (id) {
    if (!typeOf(id)) return false;
    if (typeOf(id) === 'reviewer') return false;
    var col = { excerpt: 'ex', issue: 'is', solution: 'so', response: 're' }[typeOf(id)];
    if (col && isCollapsed(col)) toggleCol(col, false);
    if (window.innerWidth <= 960 && col && S.tab !== col) { S.tab = col; render(); }
    setFocus(id, { scroll: true, scrollSelf: true, animate: true });
    return true;
  },
  getFocus: function () { return S.focus; },
  mode: function () { return S.mode; },
  redrawWires: function () { scheduleWires(); },
  closeInspector: function () { closeInspector(); }
};

/* ---------------- boot ---------------- */
function boot() {
  var embedded = null, emb = {};
  try { var sc = document.getElementById('revmap-data'); var txt = sc ? sc.textContent.trim() : ''; embedded = txt && txt.charAt(0) === '{' ? JSON.parse(txt) : null; } catch (e) { embedded = null; }
  try { var as = document.getElementById('revmap-assets'); var t2 = as ? as.textContent.trim() : ''; emb = t2 && t2.charAt(0) === '{' ? JSON.parse(t2) : {}; } catch (e) { emb = {}; }
  S.data = migrate(embedded || blankProject());
  Object.keys(emb).forEach(function (k) { if (typeof emb[k] === 'string') S.assets.set(k, emb[k]); });
  if (!embedded) S.fileDirty = true;
  document.title = S.data.meta.title || '修改地图';
  renderShell(); bind();
  S.mode = S.data.meta.startMode === 'present' ? 'present' : 'edit';
  S.data.meta.startMode = 'edit';
  document.body.classList.toggle('present', S.mode === 'present');
  if (S.mode === 'present') buildSteps();
  renderTop(); render();
  // A presentation copy opened by someone else should leave their browser untouched until they start editing.
  if (S.mode === 'edit') { checkCache(); showHint(); }
  syncAssets(emb);
  var here = currentFileName();
  idbReq('kv', 'readonly', function (st) { return st.get('handle:' + S.data.meta.id); }).then(function (h) {
    if (h && h.name && (!here || h.name === here)) { S.fileHandle = h; S.fileName = h.name; renderSaveState(); }
  }).catch(function () { /* no stored handle */ });
  window.addEventListener('load', scheduleWires);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(scheduleWires);
  if (S.mode === 'present') setTimeout(introWires, 120);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
